name: CleanYourTV Next

# Builds and tests cleanyourtv-next/ only. Separate from ci.yml on purpose, as addons.yml is: the new launcher
# can't block or slow the reference launcher's build or its size gate, and neither sees the other's code.
on:
  pull_request:
    paths: ["cleanyourtv-next/**", ".github/workflows/next.yml"]
  push:
    paths: ["cleanyourtv-next/**", ".github/workflows/next.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests, lint and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cleanyourtv-next
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Unit tests, lint and debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: APK size
        run: |
          size=$(stat -c %s app/build/outputs/apk/debug/app-debug.apk)
          echo "debug APK: $((size / 1024)) KB"
      - name: What the APK really contains
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          aapt2="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          "$aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|native-code|launchable-activity)" || true
          echo "native libraries (.so) in the APK: $(unzip -l "$apk" | grep -c '\.so$' || true)"
          "$aapt2" dump badging "$apk" | grep -q "name='com.cleanyourtv.launcher'" || { echo "unexpected package name"; exit 1; }
          if "$aapt2" dump badging "$apk" | grep -q "^native-code"; then echo "unexpected native code"; exit 1; fi
          test "$(unzip -l "$apk" | grep -c '\.so$' || true)" = "0" || { echo "unexpected .so file"; exit 1; }
          "$aapt2" dump badging "$apk" | grep "^uses-permission" | grep -v -e "android.permission.INTERNET" -e "android.permission.READ_TV_LISTINGS" && { echo "unexpected permission"; exit 1; } || true
      # A debug APK is signed with the public debug key: fine to sideload for a test, never to publish.
      # AGENTS.md keeps APKs out of the repository and out of release workflows. This is a short-lived
      # workflow artifact (7 days) for the owner of this fork, not a release; remove the step to drop it.
      - name: Keep the debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cleanyourtv-next-debug-apk
          path: cleanyourtv-next/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
