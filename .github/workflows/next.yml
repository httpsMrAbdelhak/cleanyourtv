name: CleanYourTV Next

# Builds and tests cleanyourtv-next/ only. Separate from ci.yml on purpose, as addons.yml is: the new launcher
# can't block or slow the reference launcher's build or its size gate, and neither sees the other's code.
on:
  pull_request:
    paths: ["cleanyourtv-next/**", ".github/workflows/next.yml"]
  push:
    paths: ["cleanyourtv-next/**", ".github/workflows/next.yml"]
  workflow_dispatch:
    inputs:
      upload_apk:
        description: "Keep the debug APK as a workflow artifact for 7 days, to sideload it for a test"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Unit tests, lint and debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cleanyourtv-next
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Unit tests, lint and debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: APK size
        run: |
          size=$(stat -c %s app/build/outputs/apk/debug/app-debug.apk)
          echo "debug APK: $((size / 1024)) KB"
      # A debug APK is signed with the public debug key: fine to sideload for a test, never to publish.
      # AGENTS.md keeps APKs out of the repository and out of release workflows; this step is a manual,
      # short-lived exception for the person who owns this fork, and is off unless asked for.
      - name: Keep the debug APK (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.upload_apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cleanyourtv-next-debug-apk
          path: cleanyourtv-next/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
